<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flugpläne | AirlineSim Tools</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="tool-page">
    <main class="tool-shell">
        <a class="tool-back" href="{{ url_for('index') }}">Zur Tool-Auswahl</a>
        <header class="tool-intro">
            <p class="eyebrow">AirlineSim Tools</p>
            <h1>Flugpläne</h1>

            <span class="tool-badge planned">In Planung</span>
            <h2 id="planningTitle">Hier entsteht dein Flugplan-Tool</h2>
            <p>Die automatische Flugplan-Erstellung ist noch nicht verfügbar. Dieser Bereich ist bereits für die spätere Erweiterung vorbereitet.</p>
            <a class="tool-back" href="{{ url_for('flightplan_map') }}">Bestehende Flugpläne auf der Karte ansehen &rarr;</a>
        </section>
    </main>

</html>
